name: Build check

# Runs on every push to any branch (and on pull requests to main/develop)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Build React app (fails on build errors)
        run: npm run build
        env:
          CI: true
